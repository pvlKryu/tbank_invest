name: Integration (sandbox)

on:
  schedule:
    - cron: '0 6 * * 1' # Mondays 06:00 UTC
  workflow_dispatch:

jobs:
  sandbox-smoke:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Dart
        uses: dart-lang/setup-dart@v1

      - name: Install dependencies
        run: dart pub get

      - name: Sandbox integration smoke
        env:
          TBANK_SANDBOX_TOKEN: ${{ secrets.TBANK_SANDBOX_TOKEN }}
        run: dart test test/all_api_methods_integration_test.dart
